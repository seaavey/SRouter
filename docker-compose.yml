services:
    # Rust server, the only service. Single listener on PORT: the Node secondary
    # :1455 OAuth listener is not part of the Rust target.
    srouter:
        image: srouter:local
        build:
            context: .
            dockerfile: Dockerfile
            target: runner
        container_name: srouter
        restart: unless-stopped
        ports:
            # SRouter Gateway & Web Dashboard
            - "${PORT:-3000}:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_PATH=/app/data/srouter.db
            - WEB_DIST_PATH=/app/web/dist
        volumes:
            # Persistent storage for SQLite database (WAL mode), keys, logs, and providers
            - srouter_data:/app/data
            # Or uncomment below to use a local host directory instead of a named volume:
            # - ./data:/app/data
        healthcheck:
            # wget keeps the check free of a Node runtime.
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

volumes:
    srouter_data:
        name: srouter_data
        driver: local
