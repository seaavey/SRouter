[package]
name = "srouter-server"
# Reported as `X-Version` and in the API info body.
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5.3", features = ["util"] }
