name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # The Node job (pnpm install, `pnpm --filter web api:check`, `pnpm build`,
    # `pnpm test`) was parked while the Rust/Axum API rewrite was in flight, and
    # `apps/api` is now deleted (owner instruction 2026-10-08). Its `api:check`
    # step compared the committed `apps/web/src/generated/api.ts` against the
    # OpenAPI document the Rust build no longer publishes; the build exports
    # `server/bindings.ts` instead. The web refactor (issue #150) owns that
    # comparison. CI here enforces the server only, via `rust-lint` and
    # `rust-test`.
    # Restore a web job only after #150 consumes `server/bindings.ts`; the
    # historical job is at `git show 795ecd1:.github/workflows/ci.yml`.

    rust-lint:
        name: Rust Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              # `stable` matches server/rust-toolchain.toml; the components add
              # the two tools the checks below need.
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            - name: Check formatting
              run: cargo fmt --manifest-path server/Cargo.toml -- --check

            - name: Lint with clippy
              run: cargo clippy --manifest-path server/Cargo.toml --all-targets --all-features --locked -- -D warnings

    rust-test:
        name: Rust Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              # `stable` matches server/rust-toolchain.toml.
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            # `--locked` fails the job if `server/Cargo.lock` is out of sync with
            # `server/Cargo.toml`, so a dependency edit must update the lockfile.
            # The suite uses disposable databases only (`server/tests/support`),
            # never `~/.srouter/srouter.db` or a production `DATABASE_URL`.
            - name: Run tests
              run: cargo test --manifest-path server/Cargo.toml --locked

            # Regenerates the contract document and fails on any drift. The same
            # comparison is pinned by `server/tests/bindings.rs`, so the step
            # makes the failure visible as its own check.
            - name: Check the bindings are current
              run: |
                  cargo run --manifest-path server/Cargo.toml --bin export_ts
                  git diff --exit-code -- server/bindings.ts
