name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    rust-lint:
        name: Rust Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              # `stable` matches server/rust-toolchain.toml; the components add
              # the two tools the checks below need.
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            - name: Check formatting
              run: cargo fmt --manifest-path server/Cargo.toml -- --check

            - name: Lint with clippy
              run: cargo clippy --manifest-path server/Cargo.toml --all-targets --all-features --locked -- -D warnings

    rust-test:
        name: Rust Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              # `stable` matches server/rust-toolchain.toml.
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            # `--locked` fails the job if `server/Cargo.lock` is out of sync with
            # `server/Cargo.toml`, so a dependency edit must update the lockfile.
            # The suite uses disposable databases only (`server/tests/support`),
            # never `~/.srouter/srouter.db` or a production `DATABASE_URL`.
            - name: Run tests
              run: cargo test --manifest-path server/Cargo.toml --locked

            # Regenerates the contract document and fails on any drift. The same
            # comparison is pinned by `server/tests/bindings.rs`, so the step
            # makes the failure visible as its own check.
            - name: Check the bindings are current
              run: |
                  cargo run --manifest-path server/Cargo.toml --bin export_ts
                  git diff --exit-code -- server/bindings.ts
