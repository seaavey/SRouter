name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              # No explicit version: pnpm/action-setup reads the
              # `packageManager` field from package.json (pnpm@11.20.0).
              # Pinning `version: 11` here conflicts with package.json and
              # makes the action fail with "Multiple versions of pnpm specified".

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The dashboard's API types are generated from `server/openapi.json`;
            # this fails when the committed `apps/web/src/generated/api.ts` no
            # longer matches the contract document.
            - name: Check the generated API types
              run: pnpm --filter web api:check

            - name: Build monorepo packages & web application
              run: pnpm build

            - name: Run unit & integration tests
              run: pnpm test

    rust-lint:
        name: Rust Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              # `stable` matches server/rust-toolchain.toml; the components add
              # the two tools the checks below need.
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            - name: Check formatting
              run: cargo fmt --manifest-path server/Cargo.toml -- --check

            - name: Lint with clippy
              run: cargo clippy --manifest-path server/Cargo.toml --all-targets --all-features --locked -- -D warnings

    rust-test:
        name: Rust Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              # `stable` matches server/rust-toolchain.toml.
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: server

            # `--locked` fails the job if `server/Cargo.lock` is out of sync with
            # `server/Cargo.toml`, so a dependency edit must update the lockfile.
            # The suite uses disposable databases only (`server/tests/support`),
            # never `~/.srouter/srouter.db` or a production `DATABASE_URL`.
            - name: Run tests
              run: cargo test --manifest-path server/Cargo.toml --locked

            # Regenerates the contract document and fails on any drift. The same
            # comparison is pinned by `server/tests/openapi.rs`, so the step
            # makes the failure visible as its own check.
            - name: Check the OpenAPI export is current
              run: |
                  cargo run --manifest-path server/Cargo.toml --bin export_openapi
                  git diff --exit-code -- server/openapi.json
