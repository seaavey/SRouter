name: Build & Publish Docker to GHCR

on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

# A new push to the same ref replaces any in-flight build for that ref.
concurrency:
    group: docker-publish-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Build each architecture on a matching native runner. No QEMU emulation:
    # pnpm install / turbo build run at native speed on both platforms.
    build:
        name: Build (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        # Hard ceiling so a wedged build fails loudly instead of hanging for hours.
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Downcase repository name for Docker registry
              run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # Push an untagged per-arch image; the merge job creates the tags.
                  push: true
                  platforms: linux/${{ matrix.arch }}
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  # Scope the cache per arch so amd64 layers never poison arm64.
                  cache-from: type=gha,scope=${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

            - name: Export image digest
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              # build-push-action outputs the digest as a string ("sha256:...");
              # write it to a file first — upload-artifact takes paths, not values.
              run: echo "$DIGEST" > "digest-${{ matrix.arch }}"

            - name: Upload image digest
              uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ matrix.arch }}
                  path: digest-${{ matrix.arch }}
                  if-no-files-found: error
                  retention-days: 1

    # Combine the per-arch digests into one multi-arch manifest list and tag it.
    merge:
        name: Merge & Tag Manifest
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download image digests
              uses: actions/download-artifact@v4
              with:
                  pattern: digest-*
                  path: /tmp/digests
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Downcase repository name for Docker registry
              run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Extract Docker metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=auto
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=ref,event=branch
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            - name: Create and push multi-arch manifest
              working-directory: /tmp/digests
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
                  LABELS: ${{ steps.meta.outputs.labels }}
              run: |
                # metadata-action emits newline-delimited entries for both tags
                # and labels. Build bash arrays so label values containing
                # spaces (e.g. the repo description) stay quoted as a single
                # argument — unquoted word splitting made buildx parse
                # "High-performance" from the description as an image source.
                ARGS=()
                while IFS= read -r tag; do
                  ARGS+=( -t "$tag" )
                done <<< "$TAGS"
                while IFS= read -r label; do
                  ARGS+=( --annotation "index:${label}" )
                done <<< "$LABELS"
                for digest_file in digest-*; do
                  ARGS+=( "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat "$digest_file")" )
                done
                docker buildx imagetools create "${ARGS[@]}"

            - name: Inspect final manifest
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                # Inspect the first tag metadata-action actually created.
                # github.ref_name is not a valid image tag on branch refs
                # (contains "/") and does not match semver tags on releases.
                FIRST_TAG=$(echo "$TAGS" | head -n 1)
                docker buildx imagetools inspect "$FIRST_TAG"
